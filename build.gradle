// Top-level build file — Kotlin + Jetpack Compose rewrite
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20'
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.0.20'
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.0.20-1.0.25'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'

ext {
    build_date = "${new Date().format('yyyy-MM-dd')}"
    def descOut = new ByteArrayOutputStream()
    exec {
        executable "git"
        args "describe", "--tags", "--match", "v*"
        standardOutput descOut
        ignoreExitValue true
    }
    def desc = descOut.toString().trim() ?: "v2.1.0"
    build_revision = desc.split('-')[0]
    build_version = "APRSdroid ${build_revision} ${build_date}"
}

// ---- local.properties (never committed) ----
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def localProp(String name, String envName = null) {
    def v = project.ext.localProps.getProperty(name)
    if ((v == null || v.trim().isEmpty()) && envName != null) v = System.getenv(envName)
    return v == null ? "" : v.trim()
}
ext.localProps = localProps

// Google Maps SDK key (build-time, restricted to this app's package + signing
// certificate in Google Cloud). Set mapsApiKey= in local.properties, or the
// MAPS_API_KEY environment variable in CI. Empty = Google SDK map types hidden.
def mapsApiKey = localProp('mapsApiKey', 'MAPS_API_KEY')
// Optional default for the Google Map Tiles API key; users can also enter
// their own key at runtime in Settings -> Map.
def mapsTilesApiKey = localProp('mapsTilesApiKey', 'MAPS_TILES_API_KEY')

def versionCodeDate() {
    if (project.hasProperty("RELEASE_MINOR")) {
        return new Date().format("yyyyMMdd" + RELEASE_MINOR).toInteger()
    } else {
        return new Date().format("yyyyMMdd00").toInteger()
    }
}

android {
    namespace 'org.aprsdroid.app'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionName "$build_revision"
        versionCode versionCodeDate()
        resValue "string", "build_revision", "$build_revision"
        resValue "string", "build_date", "$build_date"
        resValue "string", "build_version", "$build_version"
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        buildConfigField "boolean", "MAPS_SDK_KEY_SET", mapsApiKey.isEmpty() ? "false" : "true"
        buildConfigField "String", "MAPS_TILES_API_KEY", "\"${mapsTilesApiKey}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    useLibrary 'org.apache.http.legacy'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/com.android.tools/proguard/coroutines.pro',
                'META-INF/proguard/coroutines.pro',
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties'
            ]
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard.cfg'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard.cfg'
        }
    }

    // Signing with a PKCS#12 certificate (e.g. issued by your own CA) kept
    // outside the repo. In local.properties:
    //   signing.storeFile=C:/path/to/aprsdroid-sign.p12
    //   signing.storePassword=...
    //   signing.keyAlias=aprsdroid
    //   signing.keyPassword=...          (usually the same as storePassword)
    // When set, BOTH debug and release builds use it, so the Google Maps key
    // only needs this one SHA-1 and debug/release install over each other.
    def p12File = localProp('signing.storeFile', 'SIGNING_STORE_FILE')
    if (!p12File.isEmpty()) {
        signingConfigs {
            p12 {
                storeFile file(p12File)
                storeType p12File.toLowerCase().endsWith('.jks') ? 'jks' : 'pkcs12'
                storePassword localProp('signing.storePassword', 'SIGNING_STORE_PASSWORD')
                keyAlias localProp('signing.keyAlias', 'SIGNING_KEY_ALIAS')
                def kp = localProp('signing.keyPassword', 'SIGNING_KEY_PASSWORD')
                keyPassword kp.isEmpty() ? localProp('signing.storePassword', 'SIGNING_STORE_PASSWORD') : kp
                enableV1Signing true
                enableV2Signing true
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.p12 }
            release { signingConfig signingConfigs.p12 }
        }
    } else if (project.hasProperty("RELEASE_KEY_ALIAS")) {
        signingConfigs {
            release {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
        androidTest {
            java.srcDirs = ['androidTest/java']
        }
        test {
            java.srcDirs = ['test/java']
            resources.srcDirs = ['test/resources']
        }
    }

    lint {
        disable 'MissingTranslation'
        disable 'InvalidPackage'
        abortOnError false
    }
}

dependencies {
    // Legacy JARs (Java — work fine from Kotlin)
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Kotlin + Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2025.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Material Components (for XML-based screens still in use)
    implementation 'com.google.android.material:material:1.12.0'

    // Maps — OSM / Google Map Tiles render in the Mapsforge MapAct (libs/);
    // the Google Maps SDK renders in GoogleMapAct and is only offered when a
    // build-time mapsApiKey is set and Play services are present.
    implementation 'com.google.android.gms:play-services-maps:19.0.0'

    // OkIO (used by APRS protocol)
    implementation 'com.squareup.okio:okio:3.9.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
