name: Build

# Two jobs:
#   test     runs on every push and pull request. It has no access to secrets.
#   release  runs only for version tags (v*) or a manual run. It uses the
#            "release" environment, which holds the signing key and Maps key
#            and should be set to require approval (see doc/RELEASES.md).

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # SHA-1 of the APRSDroid-TAK signing certificate (public information).
  # A release signed with any other key is rejected.
  EXPECTED_SIGNER_SHA1: 4baa2908e7583f65b6d06e8a9ee9695e56c93450

jobs:
  test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests, lint and debug build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn

  release:
    name: Signed release APK
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0          # git describe needs tags for versionName
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check that the signing secrets are set
        env:
          P12_B64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          missing=()
          [ -z "$P12_B64" ]  && missing+=('SIGNING_P12_BASE64')
          [ -z "$P12_PASS" ] && missing+=('SIGNING_STORE_PASSWORD')
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets in the 'release' environment: ${missing[*]}. See doc/RELEASES.md."
            exit 1
          fi

      - name: Write the signing key to a temporary file
        env:
          P12_B64: ${{ secrets.SIGNING_P12_BASE64 }}
        run: |
          umask 077
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"

      - name: Build the signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/signing.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS || 'aprsdroid' }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Delete the signing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.p12"

      - name: Verify the APK is signed with the expected key
        run: |
          apk=$(find build/outputs/apk/release -name '*.apk' ! -name '*-unsigned.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::No release APK was produced"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          sha1=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p')
          echo "Signer SHA-1: $sha1"
          if [ "$sha1" != "$EXPECTED_SIGNER_SHA1" ]; then
            echo "::error::APK is signed with an unexpected key ($sha1)"
            exit 1
          fi
          mkdir -p artifacts
          cp "$apk" "artifacts/APRSDroid-TAK-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload the APK to the workflow run
        uses: actions/upload-artifact@v5
        with:
          name: apk-release
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*.apk
